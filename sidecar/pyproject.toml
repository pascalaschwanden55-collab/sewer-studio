[project]
name = "sewer-sidecar"
version = "1.0.0"
description = "Multi-Model Vision Pipeline Sidecar for Sewer-Studio"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.2",
    "Pillow>=10.0",
    "numpy>=1.24",
    # yolo_wrapper nutzt scipy.ndimage.laplace fuer die Unschaerfe-Pruefung. Bisher kam
    # scipy nur zufaellig ueber ultralytics mit; ab ultralytics 8.4.120 nicht mehr, und
    # die CI brach ohne Codeaenderung. In requirements-lock.txt steht es laengst
    # (scipy==1.17.1) — hier fehlte nur die Angabe.
    "scipy>=1.10",
]

[project.optional-dependencies]
dino = ["groundingdino-py>=0.4"]
sam = ["sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"]
sam2 = ["sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
# "setuptools.backends._legacy:_Backend" gibt es nicht — in einer frischen Umgebung
# scheitert die Installation daran mit BackendUnavailable. Das lokale .venv verdeckte
# den Fehler, weil dort nie neu gebaut wurde.
build-backend = "setuptools.build_meta"

# Nur "sidecar" ist ein Python-Paket. Ohne diese Angabe findet setuptools daneben
# "models", "security" und "training_export" und bricht die Installation ab: Das
# sind Modellgewichte, ein Pruefskript und ein Datenordner, keine Pakete.
[tool.setuptools.packages.find]
include = ["sidecar*"]

[tool.pytest.ini_options]
# Audit-Fix: "pytest tests" lief nicht sauber durch, weil einzelne Tests echte Modelle
# (DINO/SAM/YOLO) auf der GPU laden und haengen/timeouten. Marker trennen Unit- von
# GPU-/E2E-Tests. Default-Lauf schliesst gpu/e2e aus -> schnell und stabil.
# GPU-Tests explizit:   pytest -m gpu
# Alles inkl. GPU:      pytest -m ""
testpaths = ["tests"]
addopts = "-m 'not gpu and not e2e'"
markers = [
    "gpu: laedt echte Modelle auf der GPU (DINO/SAM/YOLO real) - langsam, braucht Hardware",
    "e2e: End-to-End ueber echte HTTP-Endpunkte mit Modell-Laden",
    "slow: langsame Tests (mehrere Sekunden)",
]
